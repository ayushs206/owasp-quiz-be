name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quiz
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/quiz
      RUN_DATABASE_INTEGRATION: 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quiz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quiz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and generate Prisma Client
        run: |
          pnpm prisma:validate
          pnpm prisma:generate

      - name: Apply migrations to disposable PostgreSQL
        run: pnpm prisma:migrate:deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Run database integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@latest lint docs/openapi.yaml
