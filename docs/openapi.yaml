openapi: 3.1.0
info:
  title: OWASP TIET Quiz Portal API
  version: 1.0.0
  description: |
    Machine-readable contract for the OWASP TIET Quiz Portal backend.
    Supabase Google OAuth provides bearer JWTs. Application authorization,
    quiz timing, attempts, answers, scoring, and violations are enforced here.
  license:
    name: Unlicensed
    identifier: LicenseRef-Unlicensed
servers:
  - url: /
    description: Same origin as the deployed API
security:
  - bearerAuth: []
tags:
  - name: Profile
    description: Authenticated profile and first-login onboarding
  - name: Quizzes
    description: Student quiz discovery and details
  - name: Attempts
    description: Attempt lifecycle, timing, questions, and submission
  - name: Answers
    description: Revision-safe answer persistence
  - name: Violations
    description: Browser integrity events and enforcement state
  - name: Results
    description: Published scores and leaderboard access
  - name: Admin Quizzes
    description: Quiz configuration and lifecycle controls
  - name: Admin Questions
    description: Draft question and private image management
  - name: Admin Enrollments
    description: Roster import and enrollment administration
  - name: Admin Attempts
    description: Attempt inspection and violation review
  - name: Admin Results
    description: Result publication and leaderboard administration

paths:
  /health/live:
    get:
      security: []
      operationId: getLiveness
      summary: Check whether the API process is running
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /health/ready:
    get:
      security: []
      operationId: getReadiness
      summary: Check whether required dependencies are available
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/quiz-series:
    get:
      tags: [Quizzes]
      operationId: listAssignedQuizSeries
      summary: List quiz series containing an assigned quiz
      responses:
        '200':
          description: Assigned quiz-series page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSeriesListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/quiz-series/{seriesId}/quizzes:
    get:
      tags: [Quizzes]
      operationId: listAssignedSeriesQuizzes
      summary: List assigned quizzes within a series
      parameters:
        - $ref: '#/components/parameters/SeriesId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Assigned quiz page for the series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/me:
    get:
      tags: [Profile]
      operationId: getCurrentProfile
      summary: Get the authenticated application profile
      responses:
        '200':
          description: Current profile or onboarding-required profile shell
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/onboarding:
    post:
      tags: [Profile]
      operationId: completeOnboarding
      summary: Complete first-login student onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '200':
          description: Existing matching completed profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '201':
          description: Onboarding completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/quizzes/{quizId}:
    get:
      tags: [Quizzes]
      operationId: getAssignedQuiz
      summary: Get assigned quiz instructions and availability
      parameters:
        - $ref: '#/components/parameters/QuizId'
      responses:
        '200':
          description: Quiz detail without questions or answer keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/quizzes/{quizId}/attempts:
    post:
      tags: [Attempts]
      operationId: startOrResumeAttempt
      summary: Start or resume the student's single quiz attempt
      parameters:
        - $ref: '#/components/parameters/QuizId'
      responses:
        '200':
          description: Existing in-progress attempt resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptStartResponse'
        '201':
          description: Attempt created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptStartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/attempts/{attemptId}:
    get:
      tags: [Attempts]
      operationId: getAttempt
      summary: Get attempt state and authoritative timing
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Attempt state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/attempts/{attemptId}/questions/{displayOrder}:
    get:
      tags: [Attempts]
      operationId: getAttemptQuestion
      summary: Get one question from the student's immutable randomized order
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/DisplayOrder'
      responses:
        '200':
          description: Current question; correctness and marks are omitted
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptQuestionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/attempts/{attemptId}/answers/{questionId}:
    put:
      tags: [Answers]
      operationId: saveAnswer
      summary: Save the latest changed answer before navigation or submission
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAnswerRequest'
      responses:
        '200':
          description: Answer committed or matching retry resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveAnswerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/attempts/{attemptId}/violations:
    post:
      tags: [Violations]
      operationId: recordViolations
      summary: Record browser integrity events
      description: Camera frames, audio, recordings, face data, and ML output are not accepted.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViolationBatchRequest'
      responses:
        '200':
          description: Current violation enforcement state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViolationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /v1/attempts/{attemptId}/submit:
    post:
      tags: [Attempts]
      operationId: submitAttempt
      summary: Submit and synchronously score the attempt
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Submitted state; score remains hidden until publication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/attempts/{attemptId}/result:
    get:
      tags: [Results]
      operationId: getAttemptResult
      summary: Get a published result for the authenticated student
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Published result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/attempts/{attemptId}/review:
    get:
      tags: [Results]
      operationId: getPublishedAttemptReview
      summary: Review final answers after result publication
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Published per-question answer review
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptReviewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/quizzes/{quizId}/leaderboard:
    get:
      tags: [Results]
      operationId: getPublishedLeaderboard
      summary: Get the published student leaderboard
      parameters:
        - $ref: '#/components/parameters/QuizId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Published leaderboard page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/quiz-series:
    get:
      tags: [Admin Quizzes]
      operationId: adminListQuizSeries
      summary: List quiz series
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Quiz-series page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSeriesListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin Quizzes]
      operationId: adminCreateQuizSeries
      summary: Create a quiz series
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSeriesWriteRequest'
      responses:
        '201':
          description: Quiz series created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSeries'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/quiz-series/{seriesId}:
    get:
      tags: [Admin Quizzes]
      operationId: adminGetQuizSeries
      summary: Get a quiz series
      parameters:
        - $ref: '#/components/parameters/SeriesId'
      responses:
        '200':
          description: Quiz series detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSeries'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin Quizzes]
      operationId: adminUpdateQuizSeries
      summary: Update a quiz series
      parameters:
        - $ref: '#/components/parameters/SeriesId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSeriesWriteRequest'
      responses:
        '200':
          description: Quiz series updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSeries'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin Quizzes]
      operationId: adminDeleteQuizSeries
      summary: Delete an empty quiz series
      parameters:
        - $ref: '#/components/parameters/SeriesId'
      responses:
        '204':
          description: Quiz series deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/quizzes:
    get:
      tags: [Admin Quizzes]
      operationId: adminListQuizzes
      summary: List quizzes for administration
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Admin quiz page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin Quizzes]
      operationId: adminCreateQuiz
      summary: Create a draft quiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizWriteRequest'
      responses:
        '201':
          description: Draft quiz created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/quizzes/{quizId}:
    get:
      tags: [Admin Quizzes]
      operationId: adminGetQuiz
      summary: Get a quiz for administration
      parameters:
        - $ref: '#/components/parameters/QuizId'
      responses:
        '200':
          description: Admin quiz detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin Quizzes]
      operationId: adminUpdateQuiz
      summary: Update a draft quiz
      parameters:
        - $ref: '#/components/parameters/QuizId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizWriteRequest'
      responses:
        '200':
          description: Draft quiz updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Admin Quizzes]
      operationId: adminDeleteDraftQuiz
      summary: Delete a draft quiz that has no attempts
      parameters:
        - $ref: '#/components/parameters/QuizId'
      responses:
        '204':
          description: Draft quiz deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/quizzes/{quizId}/publish:
    post:
      tags: [Admin Quizzes]
      operationId: adminPublishQuiz
      summary: Validate and publish a draft quiz
      parameters:
        - $ref: '#/components/parameters/QuizId'
      responses:
        '200':
          $ref: '#/components/responses/QuizStateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/quizzes/{quizId}/enable:
    post:
      tags: [Admin Quizzes]
      operationId: adminEnableQuiz
      summary: Enable new attempt starts for a published quiz
      parameters:
        - $ref: '#/components/parameters/QuizId'
      responses:
        '200':
          $ref: '#/components/responses/QuizStateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/quizzes/{quizId}/disable:
    post:
      tags: [Admin Quizzes]
      operationId: adminDisableQuiz
      summary: Disable new attempt starts without interrupting active attempts
      parameters:
        - $ref: '#/components/parameters/QuizId'
      responses:
        '200':
          $ref: '#/components/responses/QuizStateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/quizzes/{quizId}/close:
    post:
      tags: [Admin Quizzes]
      operationId: adminCloseQuiz
      summary: Close a quiz and finalize remaining active attempts
      parameters:
        - $ref: '#/components/parameters/QuizId'
      responses:
        '200':
          $ref: '#/components/responses/QuizStateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/quizzes/{quizId}/clone:
    post:
      tags: [Admin Quizzes]
      operationId: adminCloneQuiz
      summary: Clone a quiz into a new editable draft
      parameters:
        - $ref: '#/components/parameters/QuizId'
      responses:
        '201':
          description: Draft clone created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/quizzes/{quizId}/summary:
    get:
      tags: [Admin Quizzes]
      operationId: adminGetQuizSummary
      summary: Get aggregate quiz administration counts
      parameters:
        - $ref: '#/components/parameters/QuizId'
      responses:
        '200':
          description: Quiz aggregate summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuizSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/quizzes/{quizId}/results/export:
    get:
      tags: [Admin Results]
      operationId: adminExportQuizResults
      summary: Stream quiz results as CSV
      parameters:
        - $ref: '#/components/parameters/QuizId'
      responses:
        '200':
          description: CSV result export without phone numbers
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/quizzes/{quizId}/questions:
    get:
      tags: [Admin Questions]
      operationId: adminListQuestions
      summary: List questions in a quiz
      parameters:
        - $ref: '#/components/parameters/QuizId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Question page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuestionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Admin Questions]
      operationId: adminCreateQuestion
      summary: Add a question to a draft quiz
      parameters:
        - $ref: '#/components/parameters/QuizId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionWriteRequest'
      responses:
        '201':
          description: Question created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/quizzes/{quizId}/questions/import:
    post:
      tags: [Admin Questions]
      operationId: adminImportQuestions
      summary: Import a bounded batch of questions into a draft quiz
      parameters:
        - $ref: '#/components/parameters/QuizId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionImportRequest'
      responses:
        '200':
          description: Question import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionImportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /v1/admin/questions/{questionId}:
    get:
      tags: [Admin Questions]
      operationId: adminGetQuestion
      summary: Get a question for administration
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: Admin question detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin Questions]
      operationId: adminUpdateQuestion
      summary: Update a question in a draft quiz
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionWriteRequest'
      responses:
        '200':
          description: Question updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Admin Questions]
      operationId: adminDeleteQuestion
      summary: Delete a question from a draft quiz
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '204':
          description: Question deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/questions/{questionId}/image-url:
    post:
      tags: [Admin Questions]
      operationId: adminCreateQuestionImageUploadUrl
      summary: Create a short-lived signed upload URL for a question image
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contentType, fileName]
              properties:
                contentType:
                  type: string
                  enum: [image/png, image/jpeg, image/webp]
                fileName:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        '200':
          description: Signed upload details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/quizzes/{quizId}/enrollments/import:
    post:
      tags: [Admin Enrollments]
      operationId: adminImportEnrollments
      summary: Import roster entries from CSV
      parameters:
        - $ref: '#/components/parameters/QuizId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentImportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /v1/admin/quizzes/{quizId}/enrollments:
    get:
      tags: [Admin Enrollments]
      operationId: adminListEnrollments
      summary: List quiz roster entries
      parameters:
        - $ref: '#/components/parameters/QuizId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Enrollment page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/enrollments/{enrollmentId}:
    patch:
      tags: [Admin Enrollments]
      operationId: adminUpdateEnrollment
      summary: Update enrollment eligibility or roster details
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentUpdateRequest'
      responses:
        '200':
          description: Enrollment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/quizzes/{quizId}/attempts:
    get:
      tags: [Admin Attempts]
      operationId: adminListAttempts
      summary: List attempts for a quiz
      parameters:
        - $ref: '#/components/parameters/QuizId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AttemptStatus'
      responses:
        '200':
          description: Attempt page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/attempts/{attemptId}:
    get:
      tags: [Admin Attempts]
      operationId: adminGetAttempt
      summary: Get an attempt for administration
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Attempt detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAttempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/attempts/{attemptId}/violations:
    get:
      tags: [Admin Attempts]
      operationId: adminListAttemptViolations
      summary: List browser violations for an attempt
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Violation page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViolationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/attempts/{attemptId}/review:
    post:
      tags: [Admin Attempts]
      operationId: adminReviewAttempt
      summary: Approve or disqualify a flagged attempt
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptReviewRequest'
      responses:
        '200':
          description: Updated attempt review state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAttempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/attempts/{attemptId}/submit:
    post:
      tags: [Admin Attempts]
      operationId: adminSubmitAttempt
      summary: Force-submit and score one attempt
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Submitted attempt state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAttempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/users:
    get:
      tags: [Profile]
      operationId: adminListUsers
      summary: List application users
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: User page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/users/{userId}:
    get:
      tags: [Profile]
      operationId: adminGetUser
      summary: Get an application user
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Profile]
      operationId: adminUpdateUser
      summary: Correct profile data or change role/account status
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdateRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/quizzes/{quizId}/results/publish:
    post:
      tags: [Admin Results]
      operationId: adminPublishResults
      summary: Publish quiz results and leaderboard
      parameters:
        - $ref: '#/components/parameters/QuizId'
      responses:
        '200':
          $ref: '#/components/responses/QuizStateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/admin/quizzes/{quizId}/leaderboard:
    get:
      tags: [Admin Results]
      operationId: adminGetLeaderboard
      summary: Get leaderboard before or after publication
      parameters:
        - $ref: '#/components/parameters/QuizId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Leaderboard page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SeriesId:
      name: seriesId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuizId:
      name: quizId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DisplayOrder:
      name: displayOrder
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid Supabase JWT
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found in the caller's scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Resource or lifecycle conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Request body exceeds the configured limit
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Temporary database or dependency failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    QuizStateResponse:
      description: Updated quiz state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuizDetail'

  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        detail:
          type: string
        requestId:
          type: string
          format: uuid
        currentRevision:
          type: integer
          format: int64
          minimum: 1

    UserRole:
      type: string
      enum: [STUDENT, ADMIN]
    AccountStatus:
      type: string
      enum: [ACTIVE, BLOCKED]
    OnboardingStatus:
      type: string
      enum: [REQUIRED, COMPLETED]
    QuizStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CLOSED, RESULTS_PUBLISHED]
    EnrollmentStatus:
      type: string
      enum: [ELIGIBLE, REVOKED]
    AttemptStatus:
      type: string
      enum: [IN_PROGRESS, SUBMITTED]
    SubmissionReason:
      type: string
      enum: [USER, EXPIRED, VIOLATION, ADMIN]
    ReviewStatus:
      type: string
      enum: [NOT_REQUIRED, PENDING, APPROVED, DISQUALIFIED]

    Profile:
      type: object
      additionalProperties: false
      required: [id, email, role, status, onboardingStatus]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          readOnly: true
        fullName:
          type: [string, 'null']
        rollNumber:
          type: [string, 'null']
        branchCode:
          type: [string, 'null']
        phoneNumber:
          type: [string, 'null']
          pattern: '^\+[1-9][0-9]{7,14}$'
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/AccountStatus'
        onboardingStatus:
          $ref: '#/components/schemas/OnboardingStatus'
        profileCompletedAt:
          type: [string, 'null']
          format: date-time

    ProfileListResponse:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
        nextCursor:
          type: [string, 'null']

    AdminUserUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        rollNumber:
          type: string
          minLength: 1
          maxLength: 40
        branchCode:
          type: string
          minLength: 1
          maxLength: 40
        phoneNumber:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/AccountStatus'

    QuizSeries:
      type: object
      additionalProperties: false
      required: [seriesId, title, description, quizCount]
      properties:
        seriesId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, 'null']
        quizCount:
          type: integer
          minimum: 0

    QuizSeriesWriteRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 2000

    QuizSeriesListResponse:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/QuizSeries'
        nextCursor:
          type: [string, 'null']

    OnboardingRequest:
      type: object
      additionalProperties: false
      required: [fullName, rollNumber, branchCode, phoneNumber]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        rollNumber:
          type: string
          minLength: 1
          maxLength: 40
        branchCode:
          type: string
          minLength: 1
          maxLength: 40
        phoneNumber:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'

    QuizSummary:
      type: object
      additionalProperties: false
      required: [quizId, seriesId, title, durationMinutes, startsAt, endsAt, status, isEnabled, availability]
      properties:
        quizId:
          type: string
          format: uuid
        seriesId:
          type: string
          format: uuid
        title:
          type: string
        durationMinutes:
          type: integer
          minimum: 1
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/QuizStatus'
        isEnabled:
          type: boolean
        availability:
          type: string
          enum: [UPCOMING, AVAILABLE, DISABLED, CLOSED, COMPLETED]
        attemptStatus:
          oneOf:
            - $ref: '#/components/schemas/AttemptStatus'
            - type: 'null'

    QuizDetail:
      allOf:
        - $ref: '#/components/schemas/QuizSummary'
        - type: object
          additionalProperties: false
          required: [description, instructions, resultsPublishedAt]
          properties:
            description:
              type: [string, 'null']
            instructions:
              type: [string, 'null']
            resultsPublishedAt:
              type: [string, 'null']
              format: date-time

    QuizListResponse:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/QuizSummary'
        nextCursor:
          type: [string, 'null']

    QuizWriteRequest:
      type: object
      additionalProperties: false
      required: [seriesId, title, durationMinutes, startsAt, endsAt]
      properties:
        seriesId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 2000
        instructions:
          type: [string, 'null']
          maxLength: 10000
        durationMinutes:
          type: integer
          minimum: 1
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time

    Attempt:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - quizId
        - status
        - startedAt
        - expiresAt
        - serverTime
        - qualifyingViolationCount
        - reviewStatus
      properties:
        attemptId:
          type: string
          format: uuid
        quizId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AttemptStatus'
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        submittedAt:
          type: [string, 'null']
          format: date-time
        submissionReason:
          oneOf:
            - $ref: '#/components/schemas/SubmissionReason'
            - type: 'null'
        serverTime:
          type: string
          format: date-time
        qualifyingViolationCount:
          type: integer
          minimum: 0
        reviewStatus:
          $ref: '#/components/schemas/ReviewStatus'

    AttemptStartResponse:
      allOf:
        - $ref: '#/components/schemas/Attempt'
        - type: object
          additionalProperties: false
          required: [questionCount, resumed]
          properties:
            questionCount:
              type: integer
              minimum: 1
            resumed:
              type: boolean

    QuestionOption:
      type: object
      additionalProperties: false
      required: [optionId, text]
      properties:
        optionId:
          type: string
          format: uuid
        text:
          type: string

    SavedAnswer:
      type: object
      additionalProperties: false
      required: [selectedOptionId, clientRevision]
      properties:
        selectedOptionId:
          type: [string, 'null']
          format: uuid
        clientRevision:
          type: integer
          format: int64
          minimum: 1

    StudentQuestion:
      type: object
      additionalProperties: false
      required: [questionId, displayOrder, prompt, imageUrl, options, savedAnswer]
      properties:
        questionId:
          type: string
          format: uuid
        displayOrder:
          type: integer
          minimum: 1
        prompt:
          type: string
        imageUrl:
          type: [string, 'null']
          format: uri
        options:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/QuestionOption'
        savedAnswer:
          oneOf:
            - $ref: '#/components/schemas/SavedAnswer'
            - type: 'null'

    AttemptQuestionResponse:
      type: object
      additionalProperties: false
      required: [attemptId, questionCount, question, hasPrevious, hasNext]
      properties:
        attemptId:
          type: string
          format: uuid
        questionCount:
          type: integer
          minimum: 1
        question:
          $ref: '#/components/schemas/StudentQuestion'
        hasPrevious:
          type: boolean
        hasNext:
          type: boolean

    SaveAnswerRequest:
      type: object
      additionalProperties: false
      required: [selectedOptionId, clientRevision, idempotencyKey]
      properties:
        selectedOptionId:
          type: [string, 'null']
          format: uuid
        clientRevision:
          type: integer
          format: int64
          minimum: 1
        idempotencyKey:
          type: string
          format: uuid

    SaveAnswerResponse:
      type: object
      additionalProperties: false
      required: [attemptId, questionId, selectedOptionId, clientRevision, savedAt, status]
      properties:
        attemptId:
          type: string
          format: uuid
        questionId:
          type: string
          format: uuid
        selectedOptionId:
          type: [string, 'null']
          format: uuid
        clientRevision:
          type: integer
          format: int64
        savedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [SAVED]

    ViolationEventRequest:
      type: object
      additionalProperties: false
      required: [eventId, type, occurredAt, metadata]
      properties:
        eventId:
          type: string
          format: uuid
        type:
          type: string
          enum: [TAB_HIDDEN, FULLSCREEN_EXIT, COPY_ATTEMPT, PASTE_ATTEMPT]
        occurredAt:
          type: string
          format: date-time
        metadata:
          type: object
          maxProperties: 20
          additionalProperties: true

    ViolationBatchRequest:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/ViolationEventRequest'

    ViolationAction:
      type: string
      enum: [NONE, WARNING, FINAL_WARNING, FORCE_SUBMITTED]

    ViolationResponse:
      type: object
      additionalProperties: false
      required: [qualifyingViolationCount, action, attemptStatus]
      properties:
        qualifyingViolationCount:
          type: integer
          minimum: 0
        action:
          $ref: '#/components/schemas/ViolationAction'
        attemptStatus:
          $ref: '#/components/schemas/AttemptStatus'

    SubmissionResponse:
      type: object
      additionalProperties: false
      required: [attemptId, status, submissionReason, submittedAt]
      properties:
